<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura funcional do Furuno FA-150</title>
  <desc id="desc">Antenas VHF e GNSS ligam-se ao transponder FA-1501, que troca dados com monitor FA-1502, sensores, radar, ECDIS, VDR, pilot plug e alarme.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#2a768b"/>
    </marker>
    <style>
      .box{fill:#f8fbfc;stroke:#173f52;stroke-width:3}.main{fill:#d9eef3;stroke:#0b2535;stroke-width:4}
      .line{fill:none;stroke:#2a768b;stroke-width:4;marker-end:url(#arrow)}.bi{marker-start:url(#arrow)}
      .t{font:700 24px system-ui,sans-serif;fill:#17262f}.s{font:18px system-ui,sans-serif;fill:#445b67}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#eef4f6"/>
  <rect class="box" x="65" y="95" width="230" height="90" rx="4"/><text class="t" x="180" y="132" text-anchor="middle">Antena VHF</text><text class="s" x="180" y="162" text-anchor="middle">TX ↔ RX</text>
  <rect class="box" x="65" y="260" width="230" height="90" rx="4"/><text class="t" x="180" y="297" text-anchor="middle">GNSS</text><text class="s" x="180" y="327" text-anchor="middle">interno / externo</text>
  <rect class="box" x="65" y="475" width="230" height="110" rx="4"/><text class="t" x="180" y="515" text-anchor="middle">Sensores</text><text class="s" x="180" y="545" text-anchor="middle">heading · ROT</text><text class="s" x="180" y="570" text-anchor="middle">SOG/COG · UTC</text>
  <rect class="main" x="425" y="220" width="350" height="220" rx="4"/><text class="t" x="600" y="285" text-anchor="middle">FA-1501</text><text class="t" x="600" y="320" text-anchor="middle">Transponder AIS</text><text class="s" x="600" y="365" text-anchor="middle">RF · TDMA · GNSS</text><text class="s" x="600" y="395" text-anchor="middle">processamento · interfaces</text>
  <rect class="box" x="485" y="510" width="230" height="100" rx="4"/><text class="t" x="600" y="550" text-anchor="middle">FA-1502</text><text class="s" x="600" y="580" text-anchor="middle">monitor / MKD</text>
  <rect class="box" x="900" y="70" width="235" height="90" rx="4"/><text class="t" x="1017" y="108" text-anchor="middle">Radar / ECDIS</text><text class="s" x="1017" y="138" text-anchor="middle">alvos e dados próprios</text>
  <rect class="box" x="900" y="225" width="235" height="90" rx="4"/><text class="t" x="1017" y="263" text-anchor="middle">VDR</text><text class="s" x="1017" y="293" text-anchor="middle">registro</text>
  <rect class="box" x="900" y="380" width="235" height="90" rx="4"/><text class="t" x="1017" y="418" text-anchor="middle">Pilot plug</text><text class="s" x="1017" y="448" text-anchor="middle">interface do prático</text>
  <rect class="box" x="900" y="535" width="235" height="90" rx="4"/><text class="t" x="1017" y="573" text-anchor="middle">Alarme / rede</text><text class="s" x="1017" y="603" text-anchor="middle">opções documentadas</text>
  <path class="line bi" d="M295 140H425"/>
  <path class="line" d="M295 305H425"/>
  <path class="line" d="M295 530H390Q425 530 425 440"/>
  <path class="line bi" d="M600 440V510"/>
  <path class="line bi" d="M775 275Q840 275 840 115H900"/>
  <path class="line" d="M775 320H900"/>
  <path class="line bi" d="M775 365Q835 365 835 425H900"/>
  <path class="line" d="M775 410Q820 410 820 580H900"/>
</svg>

